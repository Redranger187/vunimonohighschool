backend:
  name: github
  repo: reginaldganivhs/vunimono-high-school
  branch: main
  base_url: https://vunimono-high-school.pages.dev
  auth_endpoint: auth

publish_mode: editorial_workflow
media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

publish_mode: editorial_workflow
collections:
  - name: "school-settings"
    label: "School Settings"
    files:
      - name: "site"
        label: "School Identity, Direction and Contact"
        file: "content/site.json"
        format: json
        fields:
          - {label: "School Name", name: "schoolName", widget: "string"}
          - {label: "Motto", name: "motto", widget: "string"}
          - {label: "Mission", name: "mission", widget: "text"}
          - {label: "Vision", name: "vision", widget: "text"}
          - {label: "School Theme", name: "theme", widget: "text"}
          - label: "Values"
            name: "values"
            widget: "list"
            field: {label: "Value", name: "value", widget: "string"}
          - label: "Contact"
            name: "contact"
            widget: "object"
            fields:
              - {label: "Address", name: "address", widget: "string"}
              - {label: "Phone", name: "phone", widget: "string"}
              - {label: "Mobile", name: "mobile", widget: "string"}
              - {label: "Email", name: "email", widget: "string"}
          - label: "Links"
            name: "links"
            widget: "object"
            fields:
              - {label: "Facebook", name: "facebook", widget: "string"}
              - {label: "Google Classroom", name: "classroom", widget: "string"}
              - {label: "Intranet URL", name: "intranet", widget: "string", required: false}
          - {label: "Footer Text", name: "footerText", widget: "string"}
  - name: "page-content"
    label: "Page Content"
    files:
      - name: "home"
        label: "Welcome to Vunimono High School"
        file: "content/pages/home.json"
        format: json
        fields:
          - {label: "Page Title", name: "title", widget: "string"}
          - {label: "Subtitle", name: "subtitle", widget: "string", required: false}
          - {label: "Introduction", name: "intro", widget: "text", required: false}
          - {label: "Hero Image", name: "image", widget: "string", required: false}
          - {label: "Sections (advanced JSON)", name: "sections", widget: "list", required: false, fields: [{label: "Type", name: "type", widget: "string"}, {label: "Title", name: "title", widget: "string", required: false}, {label: "Text", name: "text", widget: "text", required: false}, {label: "Introduction", name: "intro", widget: "text", required: false}, {label: "Image path", name: "image", widget: "string", required: false}, {label: "Link", name: "link", widget: "string", required: false}]}
